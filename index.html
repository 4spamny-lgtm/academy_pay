<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 아이 학원 매니저</title>
<style>
:root{
  --bg:#eef1f5;--surface:#ffffff;--surface2:#f5f7fa;--text:#16202f;--muted:#5d6779;--faint:#8b93a3;--line:#dde2e9;
  --accent:#2747c9;--accent-ink:#ffffff;--soft:#e5eafb;--danger:#c0392f;--ok:#1d8655;--warn:#b86e0b;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10131a;--surface:#1a1e27;--surface2:#222733;--text:#eceff5;--muted:#a3abba;--faint:#7c8495;--line:#2e3441;
    --accent:#8fa4ff;--accent-ink:#0e1530;--soft:#232b46;--danger:#f08a80;--ok:#62d19c;--warn:#f0b45a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:100px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px;background:var(--bg)}
.top h1{font-size:24px;font-weight:800;letter-spacing:-0.03em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.top h1.editable{cursor:pointer;display:flex;align-items:center;gap:6px}
.top h1 svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.add{height:42px;padding:0 16px;border-radius:21px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
main{padding:0 14px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;max-width:600px;margin:0 auto}
.tabs button{flex:1;padding:9px 0 11px;font-size:12px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.sec{font-size:15px;font-weight:800;margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-size:13px;font-weight:600;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.note{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.6;margin-bottom:12px}
.note b{display:block;margin-bottom:2px}
.note .acts{display:flex;gap:8px;margin-top:10px}
.note .acts button{padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.note .acts button.plain{background:transparent;color:var(--muted)}
.note.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 13px}
.stat small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}

/* 신청 내역 */
.ac{display:block;width:100%;padding:16px;border-top:1px solid var(--line)}
.ac:first-child{border-top:0}
.ac-top{display:flex;align-items:center;gap:9px}
.ac-top .bar{width:5px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.ac-name{font-size:18px;font-weight:800;letter-spacing:-0.02em;flex:1;min-width:0}
.ac-sub{font-size:14.5px;color:var(--muted);margin:2px 0 0 14px}
.facts{margin:10px 0 0 14px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:15px}
.facts dt{color:var(--faint);font-size:14px}
.facts dd{font-weight:600;font-variant-numeric:tabular-nums}
.ac.done{opacity:.6}
.badge{display:inline-block;flex:none;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent)}
.badge.예정,.badge.수강.예정{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.badge.wait{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.badge.end{background:var(--surface2);color:var(--muted)}
.badge.cancel{background:color-mix(in srgb,var(--danger) 13%,var(--surface));color:var(--danger)}
.badge.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.hint{font-size:13.5px;color:var(--danger);font-weight:600}

/* 결제 행 */
.pay{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.pay:first-child{border-top:0}
.pd{width:38px;text-align:center;flex:none}
.pd b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.pd small{font-size:12px;color:var(--faint)}
.pm{flex:1;min-width:0}
.pm .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pa{text-align:right;flex:none}
.pa b{display:block;font-weight:800;font-variant-numeric:tabular-nums}
.pa .badge{margin-top:3px}
.pay.cancelled .pm .t,.pay.cancelled .pa b{text-decoration:line-through;color:var(--faint)}
.quick{margin-top:5px;font-size:12.5px;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:8px;padding:3px 8px}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:15px;line-height:1.65}

.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.mnav button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:18px;text-align:center}
.mnav b{font-size:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;color:var(--muted)}
.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px}
.total b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.total span{color:var(--muted);font-size:14px}

/* 시간표 */
.tt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px 12px 0}
.tt-head,.tt-body{display:grid;grid-template-columns:36px repeat(7,1fr);gap:3px}
.tt-head div{text-align:center;font-size:14px;font-weight:800;color:var(--muted);padding-bottom:7px}
.tt-head div.today{color:var(--accent)}
.tt-time{position:relative}
.tt-time span{position:absolute;right:6px;font-size:11.5px;color:var(--faint);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.tt-col{position:relative;border-radius:6px;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--h));background-color:var(--surface2)}
.tt-col.today{background-color:var(--soft)}
.blk{position:absolute;border-radius:6px;padding:3px 4px;overflow:hidden;background:color-mix(in srgb,var(--c) 24%,var(--surface));border-left:3px solid var(--c);font-size:11.5px;line-height:1.25;text-align:left}
.blk b{display:block;font-weight:800;word-break:keep-all}
.blk span{display:block;color:var(--muted);font-size:10.5px}
.blk span.tch{color:var(--text);font-weight:600;word-break:keep-all}
.blk.multi{display:flex;flex-direction:column;gap:2px;padding:2px;background:var(--surface);border:1px solid var(--line);border-left:1px solid var(--line)}
.blk.multi .mi{flex:1;min-height:0;overflow:hidden;border-radius:4px;padding:2px 3px;background:color-mix(in srgb,var(--c) 24%,var(--surface));border-left:3px solid var(--c)}
.blk.multi .mi span{display:block}
.dl{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:14px}
.dl:first-child{border-top:0}
.dl>b{width:24px;flex:none;font-weight:800;font-size:17px}
.dl>b.today{color:var(--accent)}
.dl ul{list-style:none;flex:1;display:flex;flex-direction:column;gap:9px}
.dl li{display:flex;gap:10px;align-items:flex-start}
.dl li .dot{margin-top:7px}
.dl li time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14.5px;min-width:96px}
.dl li div{font-weight:700}
.dl li small{display:block;font-weight:500;color:var(--muted);font-size:13.5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.row{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;font-weight:700}
.row .v{font-weight:700;font-variant-numeric:tabular-nums}

/* 카드 */
.cardv{display:block;width:100%;border-radius:16px;padding:18px;margin-bottom:10px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000))}
.cardv .co{font-size:13.5px;opacity:.85}
.cardv .n{font-size:19px;font-weight:800}
.cardv .v{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px;gap:10px}
.cardv .v b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.cardv .v small{display:block;font-size:12.5px;opacity:.85}
.cardv .v span{font-size:13.5px;text-align:right;line-height:1.45}

/* 통계 */
.br{padding:12px 16px;border-top:1px solid var(--line)}
.br:first-child{border-top:0}
.br div:first-child{display:flex;justify-content:space-between;font-size:15px}
.br div:first-child b{font-variant-numeric:tabular-nums}
.br .track{height:8px;border-radius:4px;background:var(--surface2);margin-top:6px;overflow:hidden}
.br .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.menu button{display:block;width:100%;padding:15px 16px;border-top:1px solid var(--line);font-weight:700}
.menu button:first-child{border-top:0}
.menu button small{display:block;font-weight:500;color:var(--muted);font-size:13.5px}
.menu button.red{color:var(--danger)}

/* 시트 */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(8,12,22,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap.hidden{display:none}
.sheet{width:100%;max-width:600px;max-height:93vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:21px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{font-size:26px;color:var(--muted);width:36px;height:36px;text-align:center}
.f{margin-bottom:14px}
.lbl{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:16px}
.f textarea{min-height:68px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button,.seg button{padding:11px 0;border-radius:11px;border:1px solid var(--line);background:var(--surface2);font-weight:700;text-align:center}
.days button.on,.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1}
.tp{display:flex;align-items:center;gap:6px}
.tp select{flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:22px;font-weight:800;text-align:center;text-align-last:center;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.tp span{font-size:22px;font-weight:800;color:var(--muted)}
.tprev{font-size:14px;color:var(--accent);font-weight:700;margin:-4px 0 14px}
.btns{display:flex;gap:8px;margin-top:18px}
.primary{flex:1;padding:15px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;text-align:center}
.danger{padding:15px 18px;border-radius:13px;background:var(--surface2);color:var(--danger);font-weight:700;border:1px solid var(--line)}
.ghost{display:block;width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);color:var(--accent);font-weight:700;margin-top:10px;text-align:center}
.pick button{display:block;width:100%;padding:17px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);margin-bottom:8px}
.pick b{display:block;font-size:17px}
.pick span{font-size:14px;color:var(--muted)}
.guide ol{list-style:none;counter-reset:g}
.guide li{counter-increment:g;position:relative;padding:0 0 18px 42px;font-size:15.5px;line-height:1.6}
.guide li::before{content:counter(g);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.guide li b{display:block;font-size:16.5px}
.guide p{font-size:14.5px;color:var(--muted);line-height:1.6;background:var(--surface2);padding:12px 14px;border-radius:12px}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header class="top"><h1 id="title" data-act="editTitle">우리 아이 학원</h1><button class="add" data-act="addMenu">+ 추가</button></header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in">
  <button data-act="tab" data-t="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button data-act="tab" data-t="week"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M9 4v17M15 4v17"/></svg>시간표</button>
  <button data-act="tab" data-t="pay"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>결제</button>
  <button data-act="tab" data-t="cards"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>카드</button>
  <button data-act="tab" data-t="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>더보기</button>
</div></nav>
<div id="sheetWrap" class="sheet-wrap hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input id="restore" type="file" accept=".json" hidden>

<script>
/* ===== 저장 (기존 앱과 같은 저장 위치를 써서 데이터가 그대로 이어집니다) ===== */
const KEY='academy-manager-v1', GUIDE_KEY='academy-manager-guide-seen';
let canStore=true;
function readLS(k){try{return localStorage.getItem(k)}catch(e){canStore=false;return null}}
function writeLS(k,v){try{localStorage.setItem(k,v);return true}catch(e){canStore=false;return false}}

const sampleData={
 cards:[

  {id:'sample-pay-5',date:'2026-11-12',academyId:'sample-ac-1',academy:'해봄수학학원',subject:'수학',teacher:'김민지',category:'특강비',amount:90000,method:'카드',cardId:'sample-card-2',installments:1,status:'취소',cancelDate:'2026-11-13',refund:90000,note:'특강 신청 후 전액 취소'},

 ]
};
let db;
(function init(){
  const raw=readLS(KEY);
  if(raw===null){db=JSON.parse(JSON.stringify(sampleData));writeLS(KEY,JSON.stringify(db));}
  else{try{db=JSON.parse(raw)||{}}catch(e){db={}}}
  for(const k of ['academies','payments','cards']) if(!Array.isArray(db[k])) db[k]=[];
  db.academies.forEach(a=>{if(a.startDate===undefined)a.startDate='';if(a.endDate===undefined)a.endDate='';});
})();
function save(){if(!writeLS(KEY,JSON.stringify(db)))toast('이 화면에서는 저장되지 않아요');render()}

/* ===== 도구 ===== */
const DAYS=['월','화','수','목','금','토','일'];
const COLORS=['#2f8f6f','#d0613c','#3f63c7','#c79a1e','#8a55b3','#cf4b7a','#2a93ad','#6f7d2c'];
const CARD_COLORS=['#2b3f8f','#1d6b5a','#7a2f4d','#3d3d48','#8a5a12','#4b2f8a'];
const CATS=['수강료','교재비','특강비','셔틀비','시험비','기타'];
const ui={tab:'home',ym:'',payFilter:'전체',statYm:'',statAll:false,weekSoon:false};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const month=()=>today().slice(0,7);
ui.ym=month();ui.statYm=month();
const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);
const won=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse=ds=>{const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d)};
const dday=ds=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((parse(ds)-t)/86400000)};
const dow=ds=>DAYS[(parse(ds).getDay()+6)%7];
const dotDate=ds=>ds?ds.replaceAll('-','.'):'';
const md=ds=>{const d=parse(ds);return (d.getMonth()+1)+'월 '+d.getDate()+'일'};
const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
const validTime=t=>/^\d{1,2}:\d{2}$/.test(t||'');
const sumAmt=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
const lastDay=ym=>{const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const shiftYm=(ym,k)=>{const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const ymLabel=ym=>{const [y,m]=ym.split('-');return y+'년 '+Number(m)+'월'};
/* 요일은 '월,수,금' '월수금' '월 수 금' '월요일, 수요일' 모두 알아봄 */
const dayList=a=>{const s=String(a.days||'').replace(/요일/g,'');return DAYS.filter(d=>s.includes(d))};
/* 시간은 '17:00' '5:30' '17시 30분' '1730' '오후 5시' 모두 알아봄 */
function normTime(t){
  t=String(t||'').trim();if(!t)return '';
  const pm=/오후|pm/i.test(t),am=/오전|am/i.test(t);
  let h,mi;const m=t.match(/(\d{1,2})\s*[:시.]\s*(\d{1,2})?/);
  if(m){h=+m[1];mi=+(m[2]||0)}
  else{const d=t.replace(/\D/g,'');if(d.length===3||d.length===4){h=+d.slice(0,-2);mi=+d.slice(-2)}else if(d.length&&d.length<=2){h=+d;mi=0}else return t}
  if(pm&&h<12)h+=12;if(am&&h===12)h=0;
  if(h>23||mi>59)return t;
  return pad(h)+':'+pad(mi);
}
function hashColor(id,list=COLORS){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return list[h%list.length]}
function acColor(a){return a.color||hashColor(a.id)}
function cardOf(id){return db.cards.find(c=>c.id===id)}
function cardLabel(id){const c=cardOf(id);return c?c.company+' '+c.name:'카드 미등록'}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1900)}
function ampm(t){if(!validTime(t))return '';let [h,m]=t.split(':').map(Number);const p=h<12?'오전':'오후';const hh=h%12===0?12:h%12;return `${p} ${hh}시${m?' '+m+'분':''}`}
function durText(min){const h=Math.floor(min/60),m=min%60;return (h?h+'시간':'')+(m?(h?' ':'')+m+'분':'')}

/* 수강 상태는 시작일·종료일로 자동 계산 */
function stOf(a){
  const t=today();
  if(a.endDate&&a.endDate<t) return '수강 종료';
  if(a.startDate&&a.startDate>t) return '수강 예정';
  if(!a.endDate&&a.status==='수강 종료') return '수강 종료';
  if(!a.startDate&&a.status==='수강 예정') return '수강 예정';
  if(a.endDate&&dday(a.endDate)<=14) return '종료 예정';
  return '수강 중';
}
const stClass={'수강 중':'','종료 예정':'wait','수강 예정':'wait','수강 종료':'end'};
function isRunning(a){const s=stOf(a);return s==='수강 중'||s==='종료 예정'}

/* ===== 홈 ===== */
function acItem(a){
  const s=stOf(a);
  let period=(a.startDate?dotDate(a.startDate):'시작일 미입력')+' ~ '+(a.endDate?dotDate(a.endDate):'종료일 미정');
  let extra='';
  if(s==='종료 예정') extra=`<dt></dt><dd class="hint">${dday(a.endDate)===0?'오늘 마지막 수업':'종료까지 '+dday(a.endDate)+'일'}</dd>`;
  if(s==='수강 예정'&&a.startDate) extra=`<dt></dt><dd style="color:var(--warn)">${md(a.startDate)} 시작 (D-${dday(a.startDate)})</dd>`;
  const d=dayList(a);
  return `<button class="ac ${s==='수강 종료'?'done':''}" data-act="editAc" data-id="${a.id}">
    <div class="ac-top"><span class="bar" style="--c:${acColor(a)}"></span><span class="ac-name">${esc(a.name)}</span><span class="badge ${stClass[s]}">${s}</span></div>
    <div class="ac-sub">${esc(a.subject)}${a.teacher?' / '+esc(a.teacher)+' 선생님':''}</div>
    <dl class="facts">
      <dt>수업</dt><dd>${d.length?d.join(' '):'요일 미정'}${validTime(a.start)?' &nbsp;'+a.start+'~'+a.end:''}</dd>
      <dt>기간</dt><dd>${period}</dd>${extra}
      <dt>수강료</dt><dd>월 ${won(a.fee)}</dd>
    </dl></button>`;
}
function payItem(p){
  const cls=p.status==='취소'?'cancel':p.status==='예정'?'wait':'ok';
  const how=p.method==='현금'?'현금':cardLabel(p.cardId)+(+p.installments>1?' / '+p.installments+'개월 할부':'');
  let label=p.status;
  if(p.status==='예정'){const d=dday(p.date);label=d<0?'지남':d===0?'오늘':'D-'+d}
  const d=parse(p.date);
  return `<div class="pay ${p.status==='취소'?'cancelled':''}">
    <div class="pd"><b>${d.getDate()}</b><small>${d.getMonth()+1}월 ${dow(p.date)}</small></div>
    <button class="pm" data-act="editPay" data-id="${p.id}"><div class="t">${esc(p.academy||'')} ${esc(p.category)}</div><div class="s">${esc(how)}</div>${p.status==='취소'?`<div class="s" style="color:var(--danger)">${dotDate(p.cancelDate)} 취소, 환불 ${won(p.refund)}</div>`:''}</button>
    <div class="pa"><b>${won(p.amount)}</b>${p.status==='예정'?`<button class="quick" data-act="markPaid" data-id="${p.id}">결제했어요</button>`:`<span class="badge ${cls}">${label}</span>`}</div>
  </div>`;
}
function vHome(){
  const m=month(),P=db.payments.filter(p=>p.date?.startsWith(m));
  const conf=sumAmt(P.filter(p=>p.status==='확정')),pend=sumAmt(P.filter(p=>p.status==='예정'));
  const running=db.academies.filter(isRunning);
  let h='';
  if(!canStore) h+=`<div class="note warn"><b>지금 화면에서는 저장되지 않아요</b>파일을 기기에 내려받아 크롬이나 사파리로 열면 입력한 내용이 저장돼요.</div>`;
  if(readLS(GUIDE_KEY)===null) h+=`<div class="note"><b>처음이세요?</b>카드 등록, 수업 등록, 결제 등록 순서로 쓰면 돼요. 1분이면 읽어요.<div class="acts"><button data-act="guide">사용법 보기</button><button class="plain" data-act="hideGuide">다시 안 보기</button></div></div>`;
  h+=`<div class="stats">
    <div class="stat"><small>이번 달 낸 돈</small><b>${won(conf)}</b></div>
    <div class="stat"><small>낼 예정</small><b>${won(pend)}</b></div>
    <div class="stat"><small>다니는 곳</small><b>${running.length}곳</b></div></div>`;
  const order=['수강 중','종료 예정','수강 예정','수강 종료'];
  const sorted=[...db.academies].sort((a,b)=>order.indexOf(stOf(a))-order.indexOf(stOf(b))||(a.start||'').localeCompare(b.start||''));
  const monthly=running.reduce((s,a)=>s+(+a.fee||0),0);
  h+=`<div class="sec">신청 내역 전체 <small>다니는 곳 월 ${won(monthly)}</small></div>`;
  h+=`<div class="box">${sorted.length?sorted.map(acItem).join(''):'<div class="empty">아직 신청한 수업이 없어요.<br>오른쪽 위 <b>+ 추가</b>에서 수업을 등록하세요.</div>'}</div>`;
  const next=db.payments.filter(p=>p.status==='예정').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  h+=`<div class="sec">낼 돈 <small>결제 예정 ${db.payments.filter(p=>p.status==='예정').length}건</small></div>`;
  h+=`<div class="box">${next.length?next.map(payItem).join(''):'<div class="empty">예정된 결제가 없어요.</div>'}</div>`;
  return h;
}

/* ===== 시간표 ===== */
function weekReason(a){
  const s=stOf(a);
  if(s==='수강 종료') return a.endDate?dotDate(a.endDate)+'에 수업이 끝났어요':'수강 종료로 되어 있어요';
  if(s==='수강 예정'&&!ui.weekSoon) return a.startDate?dotDate(a.startDate)+'부터 시작이라 아직 안 나와요':'수강 예정으로 되어 있어요';
  if(!dayList(a).length) return '수업 요일이 없어요';
  if(!validTime(a.start)||!validTime(a.end)) return '수업 시간이 없어요';
  if(toMin(a.end)<=toMin(a.start)) return '끝나는 시간이 시작 시간보다 빨라요';
  return '';
}
function vWeek(){
  const items=[];
  db.academies.forEach(a=>{
    if(weekReason(a)) return;
    dayList(a).forEach(d=>items.push({a,day:DAYS.indexOf(d),s:toMin(a.start),e:toMin(a.end)}));
  });
  const soonCount=db.academies.filter(a=>stOf(a)==='수강 예정').length;
  const toggle=soonCount?`<div class="chips"><button class="${!ui.weekSoon?'on':''}" data-act="weekSoon" data-v="0">지금 다니는 수업</button><button class="${ui.weekSoon?'on':''}" data-act="weekSoon" data-v="1">시작 전 수업도 보기 ${soonCount}</button></div>`:'';
  const hidden=db.academies.filter(a=>weekReason(a)&&stOf(a)!=='수강 종료');
  const hiddenBox=hidden.length?`<div class="sec">시간표에 안 나온 수업 <small>눌러서 고치기</small></div><div class="box">${hidden.map(a=>`<button class="row" style="width:100%" data-act="editAc" data-id="${a.id}"><span class="dot" style="--c:${acColor(a)}"></span><span class="grow">${esc(a.name)}<small style="display:block;font-weight:500;color:var(--danger);font-size:13.5px">${weekReason(a)}</small></span><span style="color:var(--faint)">›</span></button>`).join('')}</div>`:'';
  if(!items.length) return toggle+`<div class="box"><div class="empty">${db.academies.length?'시간표에 넣을 수 있는 수업이 없어요. 아래에서 이유를 확인해 주세요.':'아직 등록한 수업이 없어요.<br>오른쪽 위 <b>+ 추가</b>에서 수업을 등록하세요.'}</div></div>`+hiddenBox;
  const minH=Math.floor(Math.min(...items.map(i=>i.s))/60),maxH=Math.ceil(Math.max(...items.map(i=>i.e))/60);
  const H=56,height=(maxH-minH)*H,ti=(new Date().getDay()+6)%7;
  let time=`<div class="tt-time" style="height:${height}px">`;
  for(let x=minH;x<=maxH;x++) time+=`<span style="top:${(x-minH)*H}px">${x}</span>`;
  time+='</div>';
  let cols='';
  for(let d=0;d<7;d++){
    const its=items.filter(i=>i.day===d).sort((x,y)=>x.s-y.s||x.e-y.e);
    /* 시간이 겹치는 수업끼리 묶기 */
    const groups=[];
    its.forEach(i=>{const g=groups.at(-1);if(g&&i.s<g.e){g.list.push(i);g.e=Math.max(g.e,i.e)}else groups.push({s:i.s,e:i.e,list:[i]})});
    cols+=`<div class="tt-col ${d===ti?'today':''}" style="height:${height}px;--h:${H}px">`+groups.map(g=>{
      const pos=`top:${(g.s-minH*60)/60*H+1}px;height:${(g.e-g.s)/60*H-2}px`;
      if(g.list.length===1){const i=g.list[0];
        return `<button class="blk" data-act="editAc" data-id="${i.a.id}" style="--c:${acColor(i.a)};${pos};left:0;right:0"><b>${esc(i.a.subject||i.a.name)}</b>${i.a.teacher?`<span class="tch">${esc(i.a.teacher)}</span>`:''}<span>${i.a.start}</span></button>`;}
      return `<button class="blk multi" data-act="pickAc" data-ids="${g.list.map(i=>i.a.id).join(',')}" style="${pos};left:0;right:0">${g.list.map(i=>`<div class="mi" style="--c:${acColor(i.a)}"><b>${esc(i.a.subject||i.a.name)}</b>${i.a.teacher?`<span class="tch">${esc(i.a.teacher)}</span>`:''}</div>`).join('')}</button>`;
    }).join('')+'</div>';
  }
  let h=toggle+`<div class="tt"><div class="tt-head"><div></div>${DAYS.map((d,i)=>`<div class="${i===ti?'today':''}">${d}</div>`).join('')}</div><div class="tt-body">${time}${cols}</div></div>`;
  h+=`<div class="sec">요일별 일정</div><div class="box">`;
  for(let d=0;d<7;d++){
    const its=items.filter(i=>i.day===d).sort((x,y)=>x.s-y.s);
    if(!its.length) continue;
    h+=`<div class="dl"><b class="${d===ti?'today':''}">${DAYS[d]}</b><ul>${its.map(i=>`<li><time>${i.a.start}~${i.a.end}</time><span class="dot" style="--c:${acColor(i.a)}"></span><div>${esc(i.a.name)}<small>${esc(i.a.subject)}${i.a.teacher?' / '+esc(i.a.teacher):''}</small></div></li>`).join('')}</ul></div>`;
  }
  h+='</div>';
  const mins={};items.forEach(i=>mins[i.a.id]=(mins[i.a.id]||0)+(i.e-i.s));
  const tot=Object.values(mins).reduce((a,b)=>a+b,0);
  h+=`<div class="sec">일주일 수업 시간 <small>총 ${durText(tot)}</small></div><div class="box">`+
    Object.entries(mins).map(([id,m])=>{const a=db.academies.find(x=>x.id===id);return `<div class="row"><span class="dot" style="--c:${acColor(a)}"></span><span class="grow">${esc(a.name)}</span><span class="v">${durText(m)}</span></div>`}).join('')+'</div>';
  return h+hiddenBox;
}

/* ===== 결제 ===== */
function vPay(){
  let P=db.payments.filter(p=>p.date?.startsWith(ui.ym));
  const all=P;
  if(ui.payFilter!=='전체') P=P.filter(p=>p.status===ui.payFilter);
  P.sort((a,b)=>a.date.localeCompare(b.date));
  let h=`<div class="mnav"><button data-act="prev" aria-label="이전 달">‹</button><b>${ymLabel(ui.ym)}</b><button data-act="next" aria-label="다음 달">›</button></div>`;
  h+=`<div class="chips">${['전체','예정','확정','취소'].map(s=>`<button class="${ui.payFilter===s?'on':''}" data-act="payFilter" data-v="${s}">${s==='확정'?'결제 완료':s} ${s==='전체'?all.length:all.filter(p=>p.status===s).length}</button>`).join('')}</div>`;
  const conf=sumAmt(all.filter(p=>p.status==='확정')),pend=sumAmt(all.filter(p=>p.status==='예정')),ref=all.filter(p=>p.status==='취소').reduce((s,p)=>s+(+p.refund||0),0);
  h+=`<div class="box"><div class="total"><span>낸 돈</span><b>${won(conf)}</b></div><div class="total" style="border-top:1px solid var(--line)"><span>낼 예정</span><b>${won(pend)}</b></div>${ref?`<div class="total" style="border-top:1px solid var(--line)"><span>환불 받은 돈</span><b>${won(ref)}</b></div>`:''}</div>`;
  h+=`<div class="box">${P.length?P.map(payItem).join(''):'<div class="empty">이 달에는 결제 기록이 없어요.</div>'}</div>`;
  h+=`<button class="ghost" data-act="newPay">+ 결제 등록</button>`;
  return h;
}

/* ===== 카드 ===== */
function nextBill(c){
  const t=new Date(),day=+c.dueDay||1;
  let y=t.getFullYear(),m=t.getMonth()+1;
  if(t.getDate()>day){m++;if(m>12){m=1;y++}}
  const ym=y+'-'+pad(m);return ym+'-'+pad(Math.min(day,lastDay(ym)));
}
function vCards(){
  const m=month();
  let h=`<div class="sec">${new Date().getMonth()+1}월 카드 사용</div>`;
  if(!db.cards.length) h+=`<div class="box"><div class="empty">카드를 등록하면 카드별로 얼마를 썼는지, 대금이 언제 나가는지 볼 수 있어요.</div></div>`;
  db.cards.forEach((c,i)=>{
    const P=db.payments.filter(p=>p.cardId===c.id&&p.status!=='취소'&&p.date?.startsWith(m));
    const inst=db.payments.filter(p=>p.cardId===c.id&&p.status==='확정'&&+p.installments>1).length;
    const nb=nextBill(c),dd=dday(nb);
    h+=`<button class="cardv" style="--c:${c.color||CARD_COLORS[i%CARD_COLORS.length]}" data-act="editCard" data-id="${c.id}">
      <div class="co">${esc(c.company)}</div><div class="n">${esc(c.name)}</div>
      <div class="v"><div><small>이번 달 사용</small><b>${won(sumAmt(P))}</b></div>
      <span>대금 결제일 매월 ${esc(c.dueDay)}일<br>다음 ${md(nb)} (${dd===0?'오늘':'D-'+dd})${inst?'<br>할부 '+inst+'건':''}</span></div></button>`;
  });
  h+=`<button class="ghost" data-act="newCard">+ 카드 등록</button>`;
  h+=`<p class="empty" style="font-size:13.5px;padding:16px 8px">실제 청구 금액은 카드사 이용기간에 따라 달라질 수 있어요.</p>`;
  return h;
}

/* ===== 더보기 ===== */
function bars(map){
  const e=Object.entries(map).sort((a,b)=>b[1]-a[1]);if(!e.length) return '<div class="empty">내역이 없어요.</div>';
  const max=e[0][1]||1;
  return e.map(([k,v])=>`<div class="br"><div><span>${esc(k)}</span><b>${won(v)}</b></div><div class="track"><i style="width:${v/max*100}%"></i></div></div>`).join('');
}
function vMore(){
  const P=db.payments.filter(p=>p.status==='확정'&&(ui.statAll||p.date?.startsWith(ui.statYm)));

  h+=`<div class="sec">결제 수단별</div><div class="box">${bars(g(p=>p.method==='현금'?'현금':cardLabel(p.cardId)))}</div>`;

const seg=(g,opts,val)=>`<div class="seg">${opts.map(o=>`<button type="button" data-act="seg" data-g="${g}" data-v="${o[0]}" class="${o[0]===val?'on':''}">${o[1]}</button>`).join('')}</div>`;

/* 전자시계식 시간 입력: 시·분을 각각 고름 */
function timePick(id,val){
  const [vh,vm]=validTime(val)?val.split(':').map(Number):[null,null];
  let hs='';for(let h=6;h<=23;h++)hs+=`<option value="${h}" ${h===vh?'selected':''}>${pad(h)}</option>`;
  if(vh!==null&&(vh<6))hs=`<option value="${vh}" selected>${pad(vh)}</option>`+hs;
  const mins=[0,5,10,15,20,25,30,35,40,45,50,55];if(vm!==null&&!mins.includes(vm)){mins.push(vm);mins.sort((a,b)=>a-b)}
  const ms=mins.map(m=>`<option value="${m}" ${m===vm?'selected':''}>${pad(m)}</option>`).join('');
  return `<div class="tp"><select id="${id}_h" aria-label="시">${hs}</select><span>:</span><select id="${id}_m" aria-label="분">${ms}</select></div>`;
}
const readTime=id=>pad($(id+'_h').value)+':'+pad($(id+'_m').value);
function updateTimePreview(){
  const el=$('tprev');if(!el)return;
  const s=readTime('t_start'),e=readTime('t_end'),d=toMin(e)-toMin(s);
  el.textContent=d>0?`${ampm(s)} ~ ${ampm(e)} (${durText(d)})`:'끝나는 시간이 시작 시간보다 늦어야 해요';
  el.style.color=d>0?'':'var(--danger)';
}

function commit(msg){save();closeSheet();if(msg)toast(msg)}
function download(name,content,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const A={
  tab:d=>{ui.tab=d.t;render();window.scrollTo(0,0)},
  addMenu:sheetAdd, close:closeSheet,
  pickAc:d=>{
    const list=d.ids.split(',').map(id=>db.academies.find(a=>a.id===id)).filter(Boolean);
    openSheet(`<h2>같은 시간 수업 ${list.length}개${X}</h2><div class="box">${list.map(a=>`<button class="row" style="width:100%" data-act="editAc" data-id="${a.id}"><span class="dot" style="--c:${acColor(a)}"></span><span class="grow">${esc(a.name)}<small style="display:block;font-weight:500;color:var(--muted);font-size:14px">${esc(a.subject)}${a.teacher?' / '+esc(a.teacher)+' 선생님':''} / ${a.start}~${a.end}</small></span><span style="color:var(--faint)">›</span></button>`).join('')}</div>`);
  },
  editTitle:()=>{
    openSheet(`<h2>앱 이름 바꾸기${X}</h2>
      ${fld('홈 화면 맨 위에 보일 이름',`<input id="f_title" value="${esc(appTitle())}" maxlength="20" placeholder="예: 서연이 학원">`)}

    setTimeout(()=>{const i=$('f_title');i.focus();i.select()},50);
  },
  saveTitle:()=>{db.title=$('f_title').value.trim();commit('이름을 바꿨어요')},
  resetTitle:()=>{db.title='';commit('기본 이름으로 바꿨어요')},
  guide:sheetGuide,
  closeGuide:()=>{writeLS(GUIDE_KEY,'1');closeSheet();render()},
  hideGuide:()=>{writeLS(GUIDE_KEY,'1');render()},
  prev:()=>{ui.ym=shiftYm(ui.ym,-1);render()}, next:()=>{ui.ym=shiftYm(ui.ym,1);render()},
  statPrev:()=>{ui.statAll=false;ui.statYm=shiftYm(ui.statYm,-1);render()}, statNext:()=>{ui.statAll=false;ui.statYm=shiftYm(ui.statYm,1);render()},
  statMode:d=>{ui.statAll=d.v==='all';render()},
  payFilter:d=>{ui.payFilter=d.v;render()},
  weekSoon:d=>{ui.weekSoon=d.v==='1';render()},
  newAc:()=>sheetAc(''), editAc:d=>sheetAc(d.id),
  newPay:()=>sheetPay(''), editPay:d=>sheetPay(d.id),
  newCard:()=>sheetCard(''), editCard:d=>sheetCard(d.id),
  toggleDay:(d,el)=>el.classList.toggle('on'),
  seg:(d,el)=>{el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));payVis()},
  markPaid:d=>{const p=db.payments.find(x=>x.id===d.id);p.status='확정';if(p.date>today())p.date=today();save();toast('결제 완료로 바꿨어요')},
  payForAc:d=>{const a=db.academies.find(x=>x.id===d.id);sheetPay('',{academyId:a.id,academy:a.name,amount:a.fee,category:'수강료',status:'예정',note:(new Date().getMonth()+1)+'월 수강료'})},
  endToday:()=>{$('f_ed').value=today();A.saveAc()},
  saveAc:()=>{
    const name=$('f_name').value.trim();if(!name){toast('학원 이름을 넣어 주세요');return}
    const start=readTime('t_start'),end=readTime('t_end');
    if(toMin(end)<=toMin(start)){toast('끝나는 시간을 다시 확인해 주세요');return}
    const sd=$('f_sd').value,ed=$('f_ed').value;
    if(sd&&ed&&ed<sd){toast('종료일이 시작일보다 빨라요');return}
    const data={name,subject:$('f_subject').value.trim(),teacher:$('f_teacher').value.trim(),
      days:[...document.querySelectorAll('.days button.on')].map(b=>b.dataset.d).join(','),
      start,end,startDate:sd,endDate:ed,fee:Number($('f_fee').value)||0,note:$('f_note').value.trim()};
    if(editId){const i=db.academies.findIndex(x=>x.id===editId);db.academies[i]={...db.academies[i],...data};db.academies[i].status=stOf(db.academies[i])}
    else{const a={id:uid(),...data};a.status=stOf(a);db.academies.push(a)}
    commit('저장했어요');
  },
  delAc:()=>{db.academies=db.academies.filter(x=>x.id!==editId);commit('삭제했어요. 결제 기록은 남아 있어요')},
  savePay:()=>{
    const ac=db.academies.find(a=>a.id===$('f_ac').value);
    const academy=$('f_aname').value.trim()||ac?.name||'';
    if(!academy){toast('학원 이름을 넣어 주세요');return}
    const amount=Number($('f_amt').value);if(!amount){toast('금액을 넣어 주세요');return}
    const method=segVal('method'),status=segVal('status');
    if(method==='카드'&&!$('f_card').value){toast('카드 탭에서 카드를 먼저 등록해 주세요');return}
    if(status==='취소'&&!$('f_cd').value){toast('취소일을 넣어 주세요');return}
    const data={date:$('f_date').value||today(),academyId:ac?.id||'',academy,subject:ac?.subject||'',teacher:ac?.teacher||'',
      category:segVal('cat')||'기타',amount,method,cardId:method==='카드'?$('f_card').value:'',installments:method==='카드'?+$('f_inst').value:1,
      status,cancelDate:status==='취소'?$('f_cd').value:'',refund:status==='취소'?Number($('f_ref').value)||0:0,note:$('f_note').value.trim()};
    if(editId){const i=db.payments.findIndex(x=>x.id===editId);db.payments[i]={...db.payments[i],...data}}
    else db.payments.push({id:uid(),...data});
    commit('저장했어요');
  },
  delPay:()=>{db.payments=db.payments.filter(x=>x.id!==editId);commit('삭제했어요')},
  saveCard:()=>{
    const company=$('f_co').value.trim(),name=$('f_cn').value.trim()||'카드';
    if(!company){toast('카드사를 넣어 주세요');return}
    const data={company,name,dueDay:+$('f_due').value,note:$('f_note').value.trim()};
    if(editId){const i=db.cards.findIndex(x=>x.id===editId);db.cards[i]={...db.cards[i],...data}}
    else db.cards.push({id:uid(),...data});
    commit('저장했어요');
  },
  delCard:()=>{db.cards=db.cards.filter(x=>x.id!==editId);commit('삭제했어요')},
  backup:()=>download('학원매니저_백업_'+today()+'.json',JSON.stringify(db,null,2),'application/json'),
  csv:()=>{
    const head=['결제일','학원','과목','선생님','비용구분','금액','결제수단','카드사','카드명','할부개월','상태','취소일','환불액','메모'];
    const rows=db.payments.map(p=>{const c=cardOf(p.cardId);return [p.date,p.academy,p.subject,p.teacher,p.category,p.amount,p.method,c?.company||'',c?.name||'',p.installments,p.status,p.cancelDate,p.refund,p.note]});
    download('학원결제내역_'+today()+'.csv','\ufeff'+[head,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');
  },
  restoreClick:()=>$('restore').click(),
  clearSample:()=>{for(const k of ['cards','academies','payments'])db[k]=db[k].filter(x=>!String(x.id).startsWith('sample-'));save();toast('예시 데이터를 지웠어요')},
  resetAll:()=>{db={title:db.title||'',academies:[],payments:[],cards:[]};save();toast('모두 지웠어요')}
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el){if(ev.target.id==='sheetWrap')closeSheet();return}
  if(el.dataset.confirm&&!el.dataset.armed){
    el.dataset.armed='1';el._t=el.innerHTML;el.textContent=el.dataset.confirm;
    setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.innerHTML=el._t}},3000);return;
  }
  const f=A[el.dataset.act];if(f)f(el.dataset,el);
});
document.addEventListener('change',ev=>{
  const id=ev.target.id;
  if(id.startsWith('t_start')||id.startsWith('t_end')) updateTimePreview();
  if(id==='f_ac'){const a=db.academies.find(x=>x.id===ev.target.value);if(a){$('f_aname').value=a.name;if(!$('f_amt').value&&segVal('cat')==='수강료')$('f_amt').value=a.fee||''}}
});
$('restore').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!['academies','payments','cards'].every(k=>Array.isArray(d[k])))throw Error();db=d;save();toast('백업으로 되돌렸어요')}
  catch{toast('올바른 백업 파일이 아니에요')}
  e.target.value='';
});
(function fixData(){
  let changed=false;
  db.academies.forEach(a=>{
    const days=dayList(a).join(','),st=normTime(a.start),en=normTime(a.end);
    if(days&&days!==a.days){a.days=days;changed=true}
    if(st&&st!==a.start){a.start=st;changed=true}
    if(en&&en!==a.end){a.end=en;changed=true}
  });
  if(changed) writeLS(KEY,JSON.stringify(db));
})();
render();
</script>
</body>
</html>
